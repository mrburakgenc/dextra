# Backend ve frontend tek çalışma alanındadır; mobil ayrı bir pnpm köküdür (KR-006).
packages:
  - backend
  - frontend
# Kurulum betiği çalıştırmasına izin verilen paketler. Kapalı doğar; açmak kullanıcı kararıdır.
# İkisi 2026-11-24'te kullanıcı onayıyla açıldı: @prisma/engines veritabanı motorunu indirir,
# prisma yalnız Node sürümünü denetler.
allowBuilds:
  '@prisma/engines': true
  # bullmq'nun alt bağımlılığı; yerel hızlandırıcıyı derler. Kapalı: derlenmezse saf JavaScript yoluna düşer.
  msgpackr-extract: false
  prisma: true
