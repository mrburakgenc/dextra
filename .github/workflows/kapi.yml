# Sunucu tarafı kapı (GV-171): geliştiricinin makinesindeki pre-push kapısı ve testler burada da koşar.
# Gizli değer kullanmaz; belirteç yalnız okur.
name: kapi

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Aynı PR'a yeni commit gelince eski koşu iptal edilir; main'e her push ayrı koşar.
concurrency:
  group: kapi-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  zincir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # denetle --dal taban dalı yerel main adıyla arar; PR'da çekme adımı yalnız origin/main getirir.
      - name: Yerel main başvurusu
        if: github.event_name == 'pull_request'
        run: git branch main origin/main
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C backend prisma:generate
      - run: python3 harness/h.py denetle --dal

  arac-testleri:
    runs-on: ubuntu-latest
    # Testler geçici git depolarında commit atar; koşucuda git kimliği yoktur.
    env:
      GIT_AUTHOR_NAME: kapi
      GIT_AUTHOR_EMAIL: kapi@example.invalid
      GIT_COMMITTER_NAME: kapi
      GIT_COMMITTER_EMAIL: kapi@example.invalid
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      # Her dosya tek başına koşar; hepsi koşturulur, kalan dosyalar sonda adlarıyla yazılır.
      - name: Araç testleri
        run: |
          kalan=""
          for dosya in harness/test/test_*.py; do
            echo "::group::$dosya"
            if ! python3 "$dosya"; then kalan="$kalan $dosya"; fi
            echo "::endgroup::"
          done
          if [ -n "$kalan" ]; then
            echo "Kalan test dosyaları:$kalan"
            exit 1
          fi

  arka-yuz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Adresler koddaki yerel varsayılandır (127.0.0.1:5440 ve 6390); ortam değişkeni gerekmez.
      - run: docker compose up -d --wait postgres redis
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C backend prisma:generate
      - run: pnpm -C backend test
      - run: pnpm -C backend test:e2e

  on-yuz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C frontend test
